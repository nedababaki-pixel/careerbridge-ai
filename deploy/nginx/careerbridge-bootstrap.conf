# Temporary config used ONLY while the first Let's Encrypt certificate is requested.
# It answers the ACME challenge on port 80 and serves nothing else, so the app is
# never reachable over plain HTTP. Replace it with careerbridge.conf afterwards.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 503 "HTTPS is being set up. Please try again soon.\n";
    }
}
