# CareerBridge AI - Nginx reverse proxy with HTTP (80) -> HTTPS (443) redirect.
#
# Install:  sudo cp deploy/nginx/careerbridge.conf /etc/nginx/conf.d/careerbridge.conf
# Replace:  careerbridge.example.com  ->  your domain (2 places + certificate paths)
# Check:    sudo nginx -t && sudo systemctl reload nginx
#
# Gunicorn listens on 127.0.0.1:8000 only. Nginx is the only public entry point.
# Security headers (CSP, X-Frame-Options, ...) are set by the Flask app; Nginx adds HSTS.

limit_req_zone $binary_remote_addr zone=careerbridge_api:10m rate=20r/m;
limit_req_status 429;

upstream careerbridge_app {
    server 127.0.0.1:8000;
    keepalive 8;
}

# Requests for unknown host names (for example scans of the raw IP address) are dropped.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 444; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

# Port 80: only used for Let's Encrypt validation and to redirect to HTTPS.
# No application traffic (CV text, uploads, API calls) is ever served over plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name careerbridge.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# Port 443: the application over HTTPS.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name careerbridge.example.com;

    ssl_certificate     /etc/letsencrypt/live/careerbridge.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/careerbridge.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CareerBridgeTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CV uploads are at most 5 MB. A buffer of the same size keeps request bodies
    # in memory, so Nginx does not write CV files to its temporary folder.
    client_max_body_size 6m;
    client_body_buffer_size 6m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Request bodies are never logged (the default log format has no body field).
    access_log /var/log/nginx/careerbridge.access.log;
    error_log  /var/log/nginx/careerbridge.error.log warn;

    location /api/ {
        limit_req zone=careerbridge_api burst=10 nodelay;
        include /etc/nginx/careerbridge-proxy.conf;
    }
    location / {
        include /etc/nginx/careerbridge-proxy.conf;
    }
}
