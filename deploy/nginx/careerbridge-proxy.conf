# Shared proxy settings for CareerBridge AI.
# Install: sudo cp deploy/nginx/careerbridge-proxy.conf /etc/nginx/careerbridge-proxy.conf
proxy_pass http://careerbridge_app;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
# The app sends HSTS itself over HTTPS; hide it so the header is not sent twice.
proxy_hide_header Strict-Transport-Security;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
# Longer than the app's Gemini timeout (10 + 90 s) so Nginx does not cut off slow AI answers with a 504.
proxy_read_timeout 125s;
